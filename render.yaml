services:
  - type: web
    name: lantern-p2p
    runtime: python
    plan: free
    region: oregon
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
