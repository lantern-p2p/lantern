<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern browser transfer smoke test</title>
  <style>
    body { max-width: 760px; margin: 48px auto; padding: 0 20px; color: #eef2e9; background: #101514; font: 16px/1.5 system-ui, sans-serif }
    button { padding: 10px 16px; color: #16200a; background: #d3f17a; border: 0; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer }
    button:disabled { opacity: .5; cursor: wait }
    pre { min-height: 180px; padding: 16px; overflow: auto; border: 1px solid #34413b; border-radius: 10px; background: #0b100f; white-space: pre-wrap }
    iframe { position: fixed; width: 1px; height: 1px; left: -10px; top: -10px; border: 0 }
  </style>
</head>
<body>
  <h1>Lantern local browser smoke test</h1>
  <p>This test creates two local browser peers, transfers synthetic data only, verifies the received SHA-256 hashes, and saves through an in-memory file-system stub. No real files leave this browser.</p>
  <button id="run">Run transfer test</button>
  <pre id="result" role="status" aria-live="polite">Ready. Start the Lantern local server first.</pre>
  <script>
    const runButton = document.querySelector('#run');
    const result = document.querySelector('#result');
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const waitFor = async (check, label, timeout = 15000) => {
      const until = Date.now() + timeout;
      while (Date.now() < until) {
        if (check()) return;
        await sleep(50);
      }
      throw new Error(`Timed out waiting for ${label}.`);
    };

    runButton.addEventListener('click', async () => {
      runButton.disabled = true;
      const frames = [];
      const say = (message) => { result.textContent += `${message}\n`; };
      try {
        result.textContent = 'Opening isolated sender and receiver pages…\n';
        for (let index = 0; index < 2; index++) {
          const frame = document.createElement('iframe');
          frame.src = `../index.html?smoke=${Date.now()}-${index}`;
          document.body.append(frame);
          frames.push(frame);
          await new Promise((resolve, reject) => {
            frame.onload = resolve;
            frame.onerror = () => reject(new Error('Could not load the Lantern app frame.'));
          });
        }

        const sender = frames[0].contentWindow;
        const receiver = frames[1].contentWindow;
        sender.createRoom();
        await waitFor(() => sender.document.querySelector('#room').textContent.trim() !== '— — — — —', 'room creation');
        const code = sender.document.querySelector('#room').textContent.trim();
        receiver.document.querySelector('#roomInput').value = code;
        receiver.joinRoom();
        await waitFor(() => sender.document.querySelector('#status').textContent.includes('Connected directly')
          && receiver.document.querySelector('#status').textContent.includes('Connected directly'), 'direct WebRTC connection');
        say('PASS: two browser peers connected directly.');

        const expectedBytes = Uint8Array.from({ length: 180000 }, (_, index) => (index * 37) % 251);
        const nested = new File([expectedBytes], 'sample.bin', { type: 'application/octet-stream' });
        Object.defineProperty(nested, 'webkitRelativePath', { value: 'smoke/nested/sample.bin' });
        const empty = new File([], 'empty.bin', { type: 'application/octet-stream' });
        const saved = new Map();
        saved.set('smoke/nested/sample.bin', new Blob(['existing content']));
        const makeDirectory = (prefix = '') => ({
          async getDirectoryHandle(name) {
            return makeDirectory(prefix ? `${prefix}/${name}` : name);
          },
          async getFileHandle(name, options = {}) {
            const path = prefix ? `${prefix}/${name}` : name;
            if (!options.create && !saved.has(path)) {
              const error = new Error('File does not exist yet.');
              error.name = 'NotFoundError';
              throw error;
            }
            return {
              async createWritable() {
                return { async write(blob) { saved.set(path, blob); }, async close() {} };
              },
            };
          },
        });
        Object.defineProperty(receiver, 'showDirectoryPicker', { configurable: true, value: async () => makeDirectory() });
        sender.showFiles([nested, empty]);
        await waitFor(() => !sender.document.querySelector('#send').disabled, 'send button');
        await sender.sendFiles();
        await waitFor(() => receiver.document.querySelector('#status').textContent.includes('Transfer received'), 'file transfer completion');
        if (receiver.document.querySelector('#accept').disabled) throw new Error('Accept button did not enable after the transfer.');
        say('PASS: non-empty and zero-byte files arrived; receiver enabled verification and save.');

        await receiver.acceptFiles();
        if (!receiver.document.querySelector('#status').textContent.includes('verified and saved')) {
          throw new Error(`Receiver did not complete verification and save: ${receiver.document.querySelector('#status').textContent}`);
        }
        if (await saved.get('smoke/nested/sample.bin').text() !== 'existing content') {
          throw new Error('An existing file was overwritten.');
        }
        const blob = saved.get('smoke/nested/sample (1).bin');
        if (!blob || blob.size !== expectedBytes.length) throw new Error('Nested file was not saved with the expected size.');
        const actualBytes = new Uint8Array(await blob.arrayBuffer());
        if (actualBytes.some((byte, index) => byte !== expectedBytes[index])) throw new Error('Saved bytes do not match the original payload.');
        if (!saved.has('empty.bin') || saved.get('empty.bin').size !== 0) throw new Error('Zero-byte file was not saved correctly.');
        say(`PASS: SHA-256 validation preserved ${actualBytes.length.toLocaleString()} bytes; nested paths and existing files were handled safely.`);
        say('All local end-to-end checks passed.');
      } catch (error) {
        say(`FAIL: ${error?.stack || error}`);
      } finally {
        for (const frame of frames) frame.remove();
        runButton.disabled = false;
      }
    });
  </script>
</body>
</html>
